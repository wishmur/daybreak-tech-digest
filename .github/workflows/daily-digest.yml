name: Daily Tech Digest

on:
  schedule:
    # Aimed at early morning US Pacific. GitHub queues scheduled jobs when it is
    # busy: measured over 16 runs, this one started between 2h47m and 5h06m after
    # its cron time, median 3h47m. 09:13 UTC therefore lands around 06:00 Pacific
    # on a median day, 05:00-07:20 either side of it. The odd minute is
    # deliberate; the top of the hour is the most contended slot.
    #
    # Do not move this earlier. The script stamps each day with the UTC date, so
    # a run landing before 08:00 UTC would label it with tomorrow's date on the
    # US West Coast. Starting at 09:13 UTC keeps the two in step year-round,
    # through DST, with no seasonal edit.
    - cron: "13 9 * * *"
  workflow_dispatch:

permissions:
  contents: write # required so the job can commit the updated data file

concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    # The whole job is a few minutes of network plus one model call. Without a
    # cap, a wedged step runs until GitHub's 6-hour default timeout.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install

      - name: Build digest
        run: bun scripts/digest.js
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Commit updated digest data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update digest data [skip ci]"
          file_pattern: public/data/digest.json
